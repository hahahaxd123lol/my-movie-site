name: Build Flix2Watch Fire TV APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "firetv-app/**"
      - ".github/workflows/firetv-apk.yml"
      - "flix2watch-logo-red-v34.png"
  push:
    branches:
      - main
      - firetv-app
      - firetv-release-v1.0.0
    tags:
      - "firetv-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create Fire TV launcher assets from official Flix2Watch artwork
        run: |
          python -m pip install --quiet Pillow
          mkdir -p firetv-app/app/src/main/res/drawable-nodpi
          mkdir -p firetv-app/app/src/main/res/drawable-xhdpi
          mkdir -p firetv-app/app/src/main/res/mipmap-anydpi-v26
          python - <<'PY'
          from PIL import Image, ImageChops
          import os

          source = Image.open("flix2watch-logo-red-v34.png").convert("RGBA")

          # Trim empty/black canvas around the artwork so it uses the available area.
          hsv = source.convert("RGB").convert("HSV")
          saturated = hsv.getchannel("S").point(lambda p: 255 if p > 35 else 0)
          bright = hsv.getchannel("V").point(lambda p: 255 if p > 105 else 0)
          visible = ImageChops.lighter(saturated, bright)
          bounds = visible.getbbox()
          if not bounds:
              raise SystemExit("Could not find visible Flix2Watch logo pixels.")
          artwork = source.crop(bounds)

          # The TV banner uses the complete wordmark at the documented 320x180 xhdpi size.
          banner = Image.new("RGBA", (320, 180), "#0b0b0f")
          wordmark = artwork.copy()
          wordmark.thumbnail((296, 150), Image.Resampling.LANCZOS)
          banner.alpha_composite(wordmark, ((320 - wordmark.width) // 2,
                                             (180 - wordmark.height) // 2))
          banner.save("firetv-app/app/src/main/res/drawable-xhdpi/flix2watch_tv_banner.png")

          # A TV launcher tile needs a legible square mark, not a tiny wide wordmark.
          # Crop the popcorn / film / play emblem from the left side of the official logo.
          mark_width = min(artwork.width, max(1, int(artwork.width * 0.29)))
          mark = artwork.crop((0, 0, mark_width, artwork.height))

          legacy = Image.new("RGBA", (512, 512), "#0b0b0f")
          mark_for_legacy = mark.copy()
          mark_for_legacy.thumbnail((380, 380), Image.Resampling.LANCZOS)
          legacy.alpha_composite(mark_for_legacy,
                                  ((512 - mark_for_legacy.width) // 2,
                                   (512 - mark_for_legacy.height) // 2))

          foreground = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          mark_for_adaptive = mark.copy()
          mark_for_adaptive.thumbnail((300, 300), Image.Resampling.LANCZOS)
          foreground.alpha_composite(mark_for_adaptive,
                                     ((432 - mark_for_adaptive.width) // 2,
                                      (432 - mark_for_adaptive.height) // 2))
          foreground.save("firetv-app/app/src/main/res/drawable-nodpi/flix2watch_icon_foreground.png")

          for density, pixels in {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }.items():
              folder = f"firetv-app/app/src/main/res/mipmap-{density}"
              os.makedirs(folder, exist_ok=True)
              legacy.resize((pixels, pixels), Image.Resampling.LANCZOS).save(
                  f"{folder}/flix2watch_logo.png"
              )

          print("Generated full wordmark TV banner, square legacy icon, and adaptive-icon foreground.")
          PY

      - name: Verify launcher artwork before building
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          root = Path("firetv-app/app/src/main/res")
          banner = Image.open(root / "drawable-xhdpi/flix2watch_tv_banner.png")
          foreground = Image.open(root / "drawable-nodpi/flix2watch_icon_foreground.png")
          assert banner.size == (320, 180), banner.size
          assert foreground.size == (432, 432), foreground.size
          for density, pixels in {
              "mdpi": 48, "hdpi": 72, "xhdpi": 96,
              "xxhdpi": 144, "xxxhdpi": 192,
          }.items():
              icon = Image.open(root / f"mipmap-{density}/flix2watch_logo.png")
              assert icon.size == (pixels, pixels), (density, icon.size)
          adaptive = root / "mipmap-anydpi-v26/flix2watch_logo.xml"
          assert adaptive.is_file() and adaptive.stat().st_size > 0
          print("Launcher icon, adaptive icon, and 320x180 xhdpi TV banner verified.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36 and build tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
        working-directory: firetv-app

      - name: Verify the actual APK manifest, icon, banner, and signature
        working-directory: firetv-app
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/flix2watch-badging.txt
          grep -q "package: name='com.flix2watch.tv' versionCode='3' versionName='1.0.2'" /tmp/flix2watch-badging.txt
          grep -q "sdkVersion:'22'" /tmp/flix2watch-badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/flix2watch-badging.txt
          grep -q "application-label:'Flix2Watch'" /tmp/flix2watch-badging.txt
          grep -q "application-icon" /tmp/flix2watch-badging.txt
          grep -q "application:.*banner='res/" /tmp/flix2watch-badging.txt
          grep -q "leanback-launchable-activity:.*banner='res/" /tmp/flix2watch-badging.txt
          "$AAPT" dump resources "$APK" | tee /tmp/flix2watch-resources.txt
          grep -q "flix2watch_logo" /tmp/flix2watch-resources.txt
          grep -q "flix2watch_icon_foreground" /tmp/flix2watch-resources.txt
          grep -q "flix2watch_tv_banner" /tmp/flix2watch-resources.txt
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK verified: release package, target API 36, TV banner, adaptive icon, and APK signature."

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Flix2Watch-FireTV.apk
        working-directory: firetv-app

      - name: Upload APK build
        uses: actions/upload-artifact@v4
        with:
          name: Flix2Watch-FireTV
          path: firetv-app/Flix2Watch-FireTV.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/firetv-v') || github.ref == 'refs/heads/firetv-release-v1.0.0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'firetv-v1.0.0' }}
          target_commitish: main
          name: Flix2Watch Fire TV v1.0.2
          files: firetv-app/Flix2Watch-FireTV.apk
          generate_release_notes: true
