name: Build Flix2Watch Fire TV APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "firetv-app/**"
      - ".github/workflows/firetv-apk.yml"
      - "flix2watch-logo-red-v34.png"
  push:
    branches:
      - "main"
      - "firetv-app"
      - "firetv-release-v1.0.0"
    tags:
      - "firetv-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create launcher assets from the official Flix2Watch logo
        run: |
          python -m pip install --quiet Pillow
          mkdir -p firetv-app/app/src/main/res/drawable-nodpi
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("flix2watch-logo-red-v34.png").convert("RGBA")

          def contain(image, size):
              image.thumbnail(size, Image.Resampling.LANCZOS)
              return image

          # Square launcher icon using the real red Flix2Watch logo.
          icon = Image.new("RGBA", (512, 512), "#0b0b0f")
          logo = contain(source.copy(), (440, 440))
          icon.alpha_composite(logo, ((512 - logo.width) // 2, (512 - logo.height) // 2))
          icon.save("firetv-app/app/src/main/res/drawable-nodpi/flix2watch_logo.png")

          # Wide Android TV banner in the same dark/red Flix2Watch branding.
          banner = Image.new("RGBA", (320, 180), "#0b0b0f")
          logo = contain(source.copy(), (288, 148))
          banner.alpha_composite(logo, ((320 - logo.width) // 2, (180 - logo.height) // 2))
          banner.save("firetv-app/app/src/main/res/drawable-nodpi/flix2watch_tv_banner.png")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: firetv-app

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Flix2Watch-FireTV.apk
        working-directory: firetv-app

      - name: Upload APK build
        uses: actions/upload-artifact@v4
        with:
          name: Flix2Watch-FireTV
          path: firetv-app/Flix2Watch-FireTV.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/firetv-v') || github.ref == 'refs/heads/firetv-release-v1.0.0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'firetv-v1.0.0' }}
          target_commitish: main
          name: Flix2Watch Fire TV v1.0.0
          files: firetv-app/Flix2Watch-FireTV.apk
          generate_release_notes: true
