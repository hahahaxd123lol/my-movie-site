</style><link rel="stylesheet" href="/page-transitions-v135.css?v=183-20260902"><link rel="stylesheet" href="/v176-sitewide.css?v=185-20260902-authfix"></head><body><header class="topbar"><a class="logo" href="/home/"><img src="/flix2watch-logo-red-v34.png" alt="Flix2Watch"></a><div class="spacer"></div><a class="toplink" href="/home/"><i class="fa-solid fa-house"></i> Home</a><a class="toplink" href="/account/"><i class="fa-solid fa-user"></i> Account</a></header><main class="shell"><div class="eyebrow">Flix2Watch</div><h1 class="title">Notifications</h1><div class="sub">Your account notifications in one place. New notifications appear here automatically.</div><section class="card"><div class="head"><strong>Notifications</strong><span class="badge" id="unread-badge" hidden>0</span><div class="spacer"></div><button class="mark" id="mark-read" type="button">Mark all read</button></div><div class="list" id="notification-page-list"><div class="loading"><span class="spinner"></span><br><br>Loading notifications…</div></div><nav class="pager" id="notification-pager" aria-label="Notification pages" hidden></nav></section></main><div class="toast" id="notification-toast" role="status" aria-live="polite"></div><script>
(()=>{'use strict';
const URL='https://viqufxlcxwgboyxbdhjb.supabase.co';
const KEY='sb_publishable_zdfvnwwgL9LI3yTK0-1Sbg_RsYRvNge';
const PAGE_SIZE=10;
let c=window.f2wSupabase||window.chatSupabase||window.supabaseClient||window.__supabaseClient||null;
if(!c?.rpc)c=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let uid='',rows=[],channels=[],timer=0,loading=false,page=1,pageCount=1,total=0,refreshTimer=0;
const list=document.getElementById('notification-page-list');
const badge=document.getElementById('unread-badge');
const mark=document.getElementById('mark-read');
const pager=document.getElementById('notification-pager');
const toast=document.getElementById('notification-toast');
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const rel=v=>{const t=new Date(v).getTime();if(!Number.isFinite(t))return'';const d=Math.max(0,Date.now()-t);if(d<6e4)return'just now';if(d<36e5)return Math.floor(d/6e4)+'m ago';if(d<864e5)return Math.floor(d/36e5)+'h ago';return Math.floor(d/864e5)+'d ago'};
const missingRpc=e=>['PGRST202','42883'].includes(e?.code)||/function .* does not exist|could not find the function/i.test(String(e?.message||''));
function asRows(raw){
  if(Array.isArray(raw))return raw;
  if(raw&&Array.isArray(raw.rows))return raw.rows;
  return [];
}
function normalizeRow(x,source){
  return {
    id:String(x?.id??''),
    source,
    notification_type:x?.notification_type||x?.type||x?.kind||'system',
    title:x?.title||'Notification',
    message:x?.message??x?.body??x?.text??'',
    link:x?.link||x?.url||x?.href||'#',
    read_at:x?.read_at||((x?.is_read===true)?new Date().toISOString():null),
    created_at:x?.created_at||x?.inserted_at||x?.updated_at||new Date().toISOString()
  };
}
function dedupe(input){
  const out=[],seen=new Map();
  input.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  for(const n of input){
    const content=[String(n.title).trim().toLowerCase(),String(n.message).trim().toLowerCase(),String(n.link||'').trim().toLowerCase()].join('|');
    const prior=seen.get(content)||[];
    const time=new Date(n.created_at).getTime()||0;
    if(prior.some(p=>p.source!==n.source&&Math.abs(p.time-time)<=6000))continue;
    out.push(n);prior.push({source:n.source,time});seen.set(content,prior);
  }
  return out;
}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2600)}
function setPayload(input,targetPage=page){
  rows=input.rows;page=input.page;pageCount=input.page_count;total=input.total_count;
  badge.textContent=String(input.unread_count||0);badge.hidden=!Number(input.unread_count||0);paint();
}
function paintPager(){
  pager.hidden=pageCount<=1;
  if(pager.hidden){pager.innerHTML='';return}
  const buttons=[];
  buttons.push(`<button class="page-btn" data-page="${Math.max(1,page-1)}" ${page<=1?'disabled':''} aria-label="Previous page">‹</button>`);
  const start=Math.max(1,Math.min(page-2,pageCount-4)),end=Math.min(pageCount,start+4);
  for(let p=start;p<=end;p++)buttons.push(`<button class="page-btn ${p===page?'active':''}" data-page="${p}" ${p===page?'aria-current="page"':''}>${p}</button>`);
  buttons.push(`<button class="page-btn" data-page="${Math.min(pageCount,page+1)}" ${page>=pageCount?'disabled':''} aria-label="Next page">›</button>`);
  pager.innerHTML=buttons.join('');
}
function paint(){
  list.innerHTML=rows.length?rows.map(x=>`<a class="note ${x.read_at?'':'unread'}" href="${esc(x.link||'#')}"><strong>${esc(x.title||'Notification')}</strong><span>${esc(x.message||'')}</span><small>${esc(rel(x.created_at))}</small></a>`).join(''):'<div class="empty">No notifications yet.</div>';
  paintPager();
}
async function fetchF2wLegacy(){
  const attempts=[
    ['get_my_notifications_v170',{p_limit:100}],
    ['get_my_notifications_v166',{p_limit:100}],
    ['get_my_notifications_v161',{p_limit:100}],
    ['get_my_notifications_v160',{p_limit:100}],
    ['get_my_notifications_v125',{p_limit:100}]
  ];
  let lastError=null;
  for(const [fn,args] of attempts){
    try{
      const out=await c.rpc(fn,args);
      if(!out?.error)return asRows(out?.data).map(x=>normalizeRow(x,'f2w'));
      lastError=out.error;
      if(!missingRpc(out.error))break;
    }catch(e){lastError=e}
  }
  if(lastError&&!missingRpc(lastError))throw lastError;
  return [];
}
async function fetchLegacyAll(){
  const userPromise=(async()=>{
    try{
      const out=await c.rpc('get_my_notifications',{p_limit:100});
      if(out?.error)throw out.error;
      return asRows(out?.data).map(x=>normalizeRow(x,'user'));
    }catch(e){console.warn('legacy user notifications unavailable',e);return []}
  })();
  const f2wPromise=(async()=>{try{return await fetchF2wLegacy()}catch(e){console.warn('legacy f2w notifications unavailable',e);return []}})();
  const merged=dedupe([...(await userPromise),...(await f2wPromise)]);
  return merged;
}
async function fetchRows(targetPage=page){
  if(loading||!uid)return;
  loading=true;
  try{
    const wanted=Math.max(1,targetPage);
    let canonical=null;
    try{
      const out=await c.rpc('get_my_notifications_v181',{p_page:wanted,p_page_size:PAGE_SIZE});
      if(out?.error)throw out.error;
      if(out?.data&&typeof out.data==='object'&&Array.isArray(out.data.rows))canonical=out.data;
    }catch(e){
      if(!missingRpc(e))console.warn('v181 notification RPC fallback',e);
    }
    if(canonical){
      setPayload({
        rows:canonical.rows.map(x=>normalizeRow(x,'user')),
        unread_count:Number(canonical.unread_count||0),
        total_count:Number(canonical.total_count||0),
        page:Math.max(1,Number(canonical.page||wanted)),
        page_count:Math.max(1,Number(canonical.page_count||1))
      });
      return;
    }
    const all=await fetchLegacyAll();
    const pages=Math.max(1,Math.ceil(all.length/PAGE_SIZE));
    const actual=Math.min(wanted,pages);
    const start=(actual-1)*PAGE_SIZE;
    setPayload({
      rows:all.slice(start,start+PAGE_SIZE),
      unread_count:all.filter(x=>!x.read_at).length,
      total_count:all.length,
      page:actual,
      page_count:pages
    });
  }catch(e){
    console.error('notifications v181',e);
    list.innerHTML='<div class="error">Notifications could not be loaded.<div><button class="mark retry" type="button" id="notif-retry">Retry</button></div></div>';
    pager.hidden=true;
  }finally{loading=false}
}
function scheduleRefresh(){clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>fetchRows(page),180)}
async function subscribe(){
  for(const ch of channels){try{c.removeChannel(ch)}catch{}}
  channels=[];
  // user_notifications is canonical; the V181 database trigger mirrors any legacy writes into it.
  const specs=[['user_notifications','canonical']];
  for(const [table,label] of specs){
    try{
      const ch=c.channel(`f2w-notifications-v181-${label}-${uid}`).on('postgres_changes',{event:'*',schema:'public',table,filter:`user_id=eq.${uid}`},scheduleRefresh).subscribe();
      channels.push(ch);
    }catch(e){console.warn('notifications realtime '+table,e)}
  }
}
async function boot(){
  const s=(await c.auth.getSession()).data?.session;
  if(!s?.user){location.replace('/home/');return}
  uid=s.user.id;
  await fetchRows(1);
  await subscribe();
  timer=setInterval(()=>{if(document.visibilityState==='visible')fetchRows(page)},60000);
  c.auth.onAuthStateChange?.((_event,next)=>{const nextUid=next?.user?.id||'';if(!nextUid){location.replace('/home/');return}if(nextUid!==uid){uid=nextUid;fetchRows(1);subscribe()}});
}
list.addEventListener('click',e=>{if(e.target.closest('#notif-retry')){e.preventDefault();fetchRows(page)}});
pager.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b||b.disabled)return;fetchRows(Number(b.dataset.page)||1).then(()=>window.scrollTo({top:0,behavior:'smooth'}))});
mark.addEventListener('click',async()=>{
  if(mark.disabled||!uid)return;
  mark.disabled=true;
  const old=mark.textContent;mark.textContent='Marking…';
  try{
    let success=false,needsFallback=false;
    try{const out=await c.rpc('mark_my_notifications_read_v181');if(!out?.error)success=true;else if(missingRpc(out.error))needsFallback=true;else throw out.error}catch(e){if(missingRpc(e))needsFallback=true;else throw e}
    if(needsFallback){
      const fallbacks=await Promise.allSettled([c.rpc('mark_all_notifications_read'),c.rpc('mark_my_notifications_read_v170'),c.rpc('mark_my_notifications_read_v179')]);
      if(fallbacks.some(r=>r.status==='fulfilled'&&!r.value?.error))success=true;
    }
    if(!success)throw new Error('Could not mark notifications as read');
    const now=new Date().toISOString();rows=rows.map(x=>({...x,read_at:x.read_at||now}));badge.textContent='0';badge.hidden=true;paint();showToast('Successfully read all messages');setTimeout(()=>fetchRows(page),150);
  }catch(e){showToast(e?.message||'Could not mark notifications as read')}
  finally{mark.disabled=false;mark.textContent=old}
});
boot();
})();
