(()=>{'use strict';const URL='https://viqufxlcxwgboyxbdhjb.supabase.co',KEY='sb_publishable_zdfvnwwgL9LI3yTK0-1Sbg_RsYRvNge';let c=window.f2wSupabase||window.chatSupabase||window.supabaseClient||window.__supabaseClient||null;if(!c?.from)c=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let uid='',rows=[],chan=null,timer=0,loading=false;const list=document.getElementById('notification-page-list'),badge=document.getElementById('unread-badge'),mark=document.getElementById('mark-read');const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const rel=v=>{const t=new Date(v).getTime();if(!Number.isFinite(t))return'';const d=Math.max(0,Date.now()-t);if(d<6e4)return'just now';if(d<36e5)return Math.floor(d/6e4)+'m ago';if(d<864e5)return Math.floor(d/36e5)+'h ago';return Math.floor(d/864e5)+'d ago'};function paint(){const n=rows.filter(x=>!x.read_at).length;badge.textContent=n;badge.hidden=!n;list.innerHTML=rows.length?rows.map(x=>`<a class="note ${x.read_at?'':'unread'}" href="${esc(x.link||'#')}"><strong>${esc(x.title||'Notification')}</strong><span>${esc(x.message||'')}</span><small>${esc(rel(x.created_at))}</small></a>`).join(''):'<div class="empty">No notifications yet.</div>'}async function fetchRows(){if(loading)return;loading=true;try{let data=null,error=null;({data,error}=await c.from('f2w_notifications_v125').select('id,title,message,link,created_at,read_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(100));if(error){const r=await c.rpc('get_my_notifications_v170',{p_limit:100});if(r.error)throw r.error;data=Array.isArray(r.data?.rows)?r.data.rows:[]}rows=Array.isArray(data)?data:[];paint()}catch(e){console.error(e);if(!rows.length)list.innerHTML='<div class="error">Could not load notifications.<div><button class="mark retry" type="button" onclick="location.reload()">Retry</button></div></div>'}finally{loading=false}}asyn
