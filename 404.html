<script id="f2w-404-friendly-profile-v153">
(async()=>{
  const m=location.pathname.match(/^\/profile\/@([A-Za-z0-9]+)\/?$/);
  if(m){
    for(let attempt=0;attempt<2;attempt++){
      try{
        const r=await fetch('/profile/index.html',{cache:'no-cache'});
        if(!r.ok)throw new Error('Profile route unavailable');
        const html=await r.text();
        document.open();document.write(html);document.close();
        return;
      }catch{ if(attempt===0) await new Promise(r=>setTimeout(r,180)); }
    }
    document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;background:#020914;color:#fff;font:600 16px Arial"><div>Profile is temporarily unavailable. <button onclick="location.reload()" style="margin-left:10px">Retry</button></div></main>';
    return;
  }
  location.replace('/home/');
})();
</script>
