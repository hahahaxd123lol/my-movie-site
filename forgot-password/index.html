<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Flix2Watch</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://viqufxlcxwgboyxbdhjb.supabase.co" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #070d16;
      --card: #0c1522;
      --border: rgba(229, 9, 20, 0.45);
      --accent: #e50914;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --error: #f87171;
      --ok: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #121c2e 0%, var(--bg) 60%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }
    .card {
      width: min(420px, 100%);
      background: linear-gradient(180deg, #0e1826, var(--card));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 24px rgba(229,9,20,.18);
    }
    .logo {
      display: block;
      width: 140px;
      margin: 0 auto 18px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
    }
    .sub {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 22px;
      line-height: 1.45;
    }
    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(229,9,20,.2);
    }
    button {
      width: 100%;
      height: 46px;
      margin-top: 6px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      transition: filter .15s;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg {
      min-height: 20px;
      margin-top: 14px;
      text-align: center;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .msg.error { color: var(--error); }
    .msg.ok { color: var(--ok); }
    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
    }
    .back:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/flix2watch-logo-red-v34.png" alt="Flix2Watch">
    <h1>Forgot your password?</h1>
    <p class="sub">Enter the email on your account and we’ll send you a reset link.</p>

    <div id="form-wrap">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@email.com">
      <button id="send-btn" type="button">Send reset link</button>
    </div>

    <div class="msg" id="msg"></div>
    <a class="back" href="/home/">← Back to Flix2Watch</a>
  </div>

  <script>
  (() => {
    const URL = 'https://viqufxlcxwgboyxbdhjb.supabase.co';
    const KEY = 'sb_publishable_zdfvnwwgL9LI3yTK0-1Sbg_RsYRvNge';
    const REDIRECT_TO = 'https://flix2watch.com/update-password/';

    const msgEl = document.getElementById('msg');
    const formWrap = document.getElementById('form-wrap');
    const sendBtn = document.getElementById('send-btn');
    const emailInput = document.getElementById('email');

    function setMsg(text, type) {
      msgEl.textContent = text || '';
      msgEl.className = 'msg' + (type ? ' ' + type : '');
    }

    const supabase = window.supabase.createClient(URL, KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    async function sendReset() {
      const email = (emailInput.value || '').trim();

      if (!email) {
        setMsg('Please enter your email address.', 'error');
        return;
      }
      if (!email.includes('@')) {
        setMsg('Please enter a valid email address.', 'error');
        return;
      }

      sendBtn.disabled = true;
      setMsg('Sending reset link…');

      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: REDIRECT_TO
        });
        if (error) throw error;

        formWrap.style.display = 'none';
        setMsg('Check your email for the reset link. It may take a minute. Then open the link to choose a new password.', 'ok');
      } catch (err) {
        console.error(err);
        setMsg(err.message || 'Could not send the reset email.', 'error');
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendReset);
    emailInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendReset();
    });

    // Prefill from query string if present (?email=...)
    try {
      const q = new URLSearchParams(location.search).get('email');
      if (q) emailInput.value = q;
    } catch {}
  })();
  </script>
</body>
</html>
