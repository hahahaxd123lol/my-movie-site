<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — Flix2Watch</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://viqufxlcxwgboyxbdhjb.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="//viqufxlcxwgboyxbdhjb.supabase.co">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #070d16;
      --card: #0c1522;
      --border: rgba(229, 9, 20, 0.45);
      --accent: #e50914;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --error: #f87171;
      --ok: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #121c2e 0%, var(--bg) 60%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }
    .card {
      width: min(420px, 100%);
      background: linear-gradient(180deg, #0e1826, var(--card));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 24px rgba(229,9,20,.18);
    }
    .logo {
      display: block;
      width: 140px;
      margin: 0 auto 18px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
    }
    .sub {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 22px;
      line-height: 1.4;
    }
    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(229,9,20,.2);
    }
    button {
      width: 100%;
      height: 46px;
      margin-top: 6px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      transition: filter .15s, transform .1s;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg {
      min-height: 20px;
      margin-top: 14px;
      text-align: center;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .msg.error { color: var(--error); }
    .msg.ok { color: var(--ok); }
    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
    }
    .back:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/flix2watch-logo-red-v34.png" alt="Flix2Watch">
    <h1>Set a new password</h1>
    <p class="sub" id="subtext">Enter a new password for your account.</p>

    <div id="form-wrap">
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" placeholder="At least 6 characters" minlength="6">

      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" placeholder="Repeat password">

      <button id="save-btn" type="button">Update password</button>
    </div>

    <div class="msg" id="msg"></div>
    <a class="back" href="/home/">← Back to Flix2Watch</a>
  </div>

  <script>
  (() => {
    const URL = 'https://viqufxlcxwgboyxbdhjb.supabase.co';
    const KEY = 'sb_publishable_zdfvnwwgL9LI3yTK0-1Sbg_RsYRvNge';

    const msgEl = document.getElementById('msg');
    const subEl = document.getElementById('subtext');
    const formWrap = document.getElementById('form-wrap');
    const saveBtn = document.getElementById('save-btn');
    const pwInput = document.getElementById('new-password');
    const confirmInput = document.getElementById('confirm-password');

    function setMsg(text, type) {
      msgEl.textContent = text || '';
      msgEl.className = 'msg' + (type ? ' ' + type : '');
    }

    const supabase = window.supabase.createClient(URL, KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    async function init() {
      // Wait for the recovery session to be established from the URL hash/query
      const { data: { session } } = await supabase.auth.getSession();

      // Also listen for the recovery event
      supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
          setMsg('Recovery link verified. Choose a new password.');
        }
      });

      if (!session) {
        // Give the client a moment to parse the hash
        await new Promise(r => setTimeout(r, 600));
        const { data: { session: s2 } } = await supabase.auth.getSession();
        if (!s2) {
          formWrap.style.display = 'none';
          subEl.textContent = 'This link is invalid or has expired.';
          setMsg('Please request a new password reset from the login form.', 'error');
          return;
        }
      }

      setMsg('Link verified. Enter your new password below.');
    }

    saveBtn.addEventListener('click', async () => {
      const password = pwInput.value;
      const confirm = confirmInput.value;

      if (!password || password.length < 6) {
        setMsg('Password must be at least 6 characters.', 'error');
        return;
      }
      if (password !== confirm) {
        setMsg('Passwords do not match.', 'error');
        return;
      }

      saveBtn.disabled = true;
      setMsg('Updating password…');

      try {
        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;

        setMsg('Password updated successfully. Redirecting…', 'ok');
        formWrap.style.display = 'none';
        setTimeout(() => { location.replace('/home/'); }, 1600);
      } catch (err) {
        console.error(err);
        setMsg(err.message || 'Could not update password.', 'error');
        saveBtn.disabled = false;
      }
    });

    // Allow Enter key
    [pwInput, confirmInput].forEach(el => {
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') saveBtn.click();
      });
    });

    init();
  })();
  </script>
</body>
</html>
