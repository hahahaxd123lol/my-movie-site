<script id="f2w-auth-modal-lock-v60">
(() => {
  'use strict';
  if(window.__f2wAuthModalLockV60)return;
  window.__f2wAuthModalLockV60=true;

  let currentMode='login';
  let touchStartX=null;
  let savedScrollY=0;
  let bodyLocked=false;

  function modal(){
    return document.getElementById('account-modal');
  }

  function lockBackground(){
    if(bodyLocked)return;
    savedScrollY=window.scrollY||window.pageYOffset||0;
    bodyLocked=true;

    document.documentElement.classList.add('f2w-auth-open-v60');
    document.body.classList.add('f2w-auth-open-v60');

    Object.assign(document.body.style,{
      position:'fixed',
      top:`-${savedScrollY}px`,
      left:'0',
      right:'0',
      width:'100%',
      overflow:'hidden'
    });
  }

  function unlockBackground(){
    if(!bodyLocked)return;
    bodyLocked=false;

    document.documentElement.classList.remove('f2w-auth-open-v60');
    document.body.classList.remove('f2w-auth-open-v60');

    document.body.style.removeProperty('position');
    document.body.style.removeProperty('top');
    document.body.style.removeProperty('left');
    document.body.style.removeProperty('right');
    document.body.style.removeProperty('width');
    document.body.style.removeProperty('overflow');

    window.scrollTo({top:savedScrollY,left:0,behavior:'auto'});
  }

  function setMode(mode, animate=true){
    currentMode=mode==='signup'?'signup':'login';

    const loginTab=document.getElementById('account-login-tab');
    const signupTab=document.getElementById('account-signup-tab');
    const usernameWrap=document.getElementById('account-username-wrap');
    const confirmWrap=document.getElementById('account-confirm-wrap');
    const emailLabel=document.getElementById('account-email-label');
    const submit=document.getElementById('account-submit');
    const password=document.getElementById('account-password');
    const card=modal()?.querySelector('.account-card');

    loginTab?.classList.toggle('active',currentMode==='login');
    signupTab?.classList.toggle('active',currentMode==='signup');

    if(usernameWrap)usernameWrap.style.display=currentMode==='signup'?'block':'none';
    if(confirmWrap)confirmWrap.style.display=currentMode==='signup'?'block':'none';
    if(emailLabel)emailLabel.textContent=currentMode==='signup'?'EMAIL':'USERNAME OR EMAIL';
    if(submit)submit.textContent=currentMode==='signup'?'Create Account':'Log In';
    if(password)password.autocomplete=currentMode==='signup'?'new-password':'current-password';

    document.querySelectorAll('#account-modal .f2w-oauth-btn.google .f2w-oauth-label')
      .forEach(el=>el.textContent=currentMode==='signup'?'Sign up with Google':'Sign in with Google');
    document.querySelectorAll('#account-modal .f2w-oauth-btn.discord .f2w-oauth-label')
      .forEach(el=>el.textContent=currentMode==='signup'?'Sign up with Discord':'Sign in with Discord');

    const message=document.getElementById('account-message');
    if(message)message.textContent='';

    if(card){
      card.classList.remove('f2w-auth-swipe-left-v60','f2w-auth-swipe-right-v60');
      if(animate){
        requestAnimationFrame(()=>{
          card.classList.add(currentMode==='signup'?'f2w-auth-swipe-left-v60':'f2w-auth-swipe-right-v60');
          setTimeout(()=>card.classList.remove('f2w-auth-swipe-left-v60','f2w-auth-swipe-right-v60'),240);
        });
      }
    }
  }

  function open(mode='login'){
    const m=modal();
    if(!m){
      console.error('Flix2Watch auth modal is missing on this page.');
      return false;
    }

    lockBackground();
    setMode(mode,false);

    m.hidden=false;
    m.classList.add('open','f2w-auth-modal-open-v60');
    m.style.setProperty('display','flex','important');
    m.setAttribute('aria-hidden','false');

    // Focus without moving the underlying page.
    setTimeout(()=>{
      const field=document.getElementById(currentMode==='signup'?'account-username':'account-email');
      try{field?.focus({preventScroll:true})}catch{field?.focus()}
    },80);

    return false;
  }

  function close(){
    const m=modal();
    if(!m)return false;

    m.classList.remove('open','f2w-auth-modal-open-v60');
    m.style.removeProperty('display');
    m.setAttribute('aria-hidden','true');
    unlockBackground();
    return false;
  }

  window.openHeaderAuth=open;
  window.f2wOpenAuth=open;
  window.showAccountMode=(mode)=>setMode(mode,true);
  window.closeAccountModal=close;

  const oldOpenAccount=typeof window.openAccountModal==='function' ? window.openAccountModal : null;
  window.openAccountModal=function(){
    if(document.body.classList.contains('f2w-authenticated') && oldOpenAccount){
      try{return oldOpenAccount();}catch(error){console.warn(error)}
    }
    return open('login');
  };

  function bind(){
    const m=modal();
    if(m && !m.dataset.f2wAuthModalV60){
      m.dataset.f2wAuthModalV60='1';

      m.addEventListener('click',e=>{
        if(e.target===m){
          e.preventDefault();
          close();
        }
      });

      m.querySelector('.chat-close')?.addEventListener('click',e=>{
        e.preventDefault();
        e.stopImmediatePropagation();
        close();
      },true);

      document.getElementById('account-login-tab')?.addEventListener('click',e=>{
        e.preventDefault();
        e.stopImmediatePropagation();
        setMode('login',true);
      },true);

      document.getElementById('account-signup-tab')?.addEventListener('click',e=>{
        e.preventDefault();
        e.stopImmediatePropagation();
        setMode('signup',true);
      },true);

      const card=m.querySelector('.account-card');
      card?.addEventListener('touchstart',e=>{
        touchStartX=e.touches?.[0]?.clientX??null;
      },{passive:true});
      card?.addEventListener('touchend',e=>{
        if(touchStartX==null)return;
        const end=e.changedTouches?.[0]?.clientX??touchStartX;
        const dx=end-touchStartX;
        touchStartX=null;
        if(Math.abs(dx)<55)return;
        setMode(dx<0?'signup':'login',true);
      },{passive:true});
    }

    document.querySelectorAll('#header-login-btn').forEach(btn=>{
      if(btn.dataset.f2wAuthV60Login)return;
      btn.dataset.f2wAuthV60Login='1';
      btn.addEventListener('click',e=>{
        e.preventDefault();
        e.stopImmediatePropagation();
        open('login');
      },true);
    });

    document.querySelectorAll('#header-signup-btn').forEach(btn=>{
      if(btn.dataset.f2wAuthV60Signup)return;
      btn.dataset.f2wAuthV60Signup='1';
      btn.addEventListener('click',e=>{
        e.preventDefault();
        e.stopImmediatePropagation();
        open('signup');
      },true);
    });

    // Watch-page center auth buttons use the exact same popup.
    const watchOverlay=document.getElementById('watch-login-overlay');
    if(watchOverlay){
      const buttons=watchOverlay.querySelectorAll('.watch-login-actions button');
      if(buttons[0] && !buttons[0].dataset.f2wAuthV60){
        buttons[0].dataset.f2wAuthV60='1';
        buttons[0].addEventListener('click',e=>{
          e.preventDefault();e.stopImmediatePropagation();open('login');
        },true);
      }
      if(buttons[1] && !buttons[1].dataset.f2wAuthV60){
        buttons[1].dataset.f2wAuthV60='1';
        buttons[1].addEventListener('click',e=>{
          e.preventDefault();e.stopImmediatePropagation();open('signup');
        },true);
      }
    }
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind,{once:true});
  else bind();

  window.addEventListener('pageshow',bind,{passive:true});
  new MutationObserver(bind).observe(document.documentElement,{childList:true,subtree:true});

  // Escape closes modal without moving the page.
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape' && modal()?.classList.contains('f2w-auth-modal-open-v60')){
      e.preventDefault();
      close();
    }
  });
})();
// f2w-force-save:auth-modal-lock-v60:1788221799
</script>
